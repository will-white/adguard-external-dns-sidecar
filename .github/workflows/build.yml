name: Build

# Reusable workflow for building and optionally pushing Docker images
# This ensures CI and CD use the exact same build process
#
# push: false (CI)      -> single-arch build, loaded locally and smoke tested
# push: true  (release) -> multi-arch build (amd64 + arm64), pushed to GHCR

on:
  workflow_call:
    inputs:
      push:
        description: 'Push the image to registry'
        required: false
        type: boolean
        default: false
      version:
        description: 'Version tag (e.g. v1.0.0)'
        required: false
        type: string
        default: ''
      latest:
        description: 'Tag as latest'
        required: false
        type: boolean
        default: true
    outputs:
      image_tags:
        description: 'The generated image tags'
        value: ${{ jobs.build.outputs.tags }}
      image_digest:
        description: 'The image digest'
        value: ${{ jobs.build.outputs.digest }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Deterministic local tag used for the CI smoke test (never pushed)
  CI_TAG: citest

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # go.mod is the single source of truth for the Go version
          go-version-file: go.mod
          # Nothing to cache: this module has zero dependencies
          cache: false

      - name: Check Go version consistency
        run: |
          gomod_ver=$(awk '/^go /{print $2; exit}' go.mod)
          docker_ver=$(sed -n 's/^FROM.*golang:\([0-9][0-9]*\.[0-9][0-9]*\).*/\1/p' Dockerfile | head -1)
          echo "go.mod:     $gomod_ver"
          echo "Dockerfile: $docker_ver"
          if [ "$gomod_ver" != "$docker_ver" ]; then
            echo "::error file=Dockerfile::Go version drift: go.mod declares $gomod_ver but the builder image is golang:$docker_ver. Bump both together."
            exit 1
          fi

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go code is not formatted:"
            gofmt -d .
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -cover -v ./...

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: lint-and-test
    timeout-minutes: 20
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build-push.outputs.digest }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version || github.ref }}

      - name: Set up QEMU
        if: inputs.push
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern=v{{version}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern=v{{major}}.{{minor}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern=v{{major}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=ref,event=tag
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable=${{ inputs.push && inputs.latest }}
            type=raw,value=${{ env.CI_TAG }},enable=${{ !inputs.push }}

      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ inputs.push }}
          # Load into the local daemon on CI runs so the image can be smoke tested.
          # Multi-arch only on release: QEMU emulation is slow and `load` cannot
          # handle a multi-platform result.
          load: ${{ !inputs.push }}
          platforms: ${{ inputs.push && 'linux/amd64,linux/arm64' || '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ hashFiles('*.go', 'go.mod') }}
          cache-to: type=gha,mode=max,scope=${{ hashFiles('*.go', 'go.mod') }}

      # The release path is otherwise never exercised until a tag is cut, so run
      # the image here: this catches a broken static link, a missing CA bundle, a
      # wrong ENTRYPOINT, or a config parser that no longer fails fast.
      - name: Smoke test the image
        if: ${{ !inputs.push }}
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.CI_TAG }}
        run: |
          set -euo pipefail

          echo "--- missing required config must fail fast ---"
          if docker run --rm "$IMAGE"; then
            echo "::error::container exited 0 with no configuration; it should have failed fast"
            exit 1
          fi
          echo "OK: exited non-zero without configuration"

          echo "--- health server must come up ---"
          docker run -d --name smoke -p 8080:8080 \
            -e ADGUARD_URL="http://127.0.0.1:1" \
            -e ADGUARD_USER="ci" \
            -e ADGUARD_PASS="ci" \
            -e ROOT_DOMAIN="example.test" \
            -e FALLBACK_IP="192.0.2.1" \
            -e CHECK_INTERVAL="5" \
            "$IMAGE"

          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8080/readyz | grep -q READY; then
              echo "OK: /readyz responded READY after ${i}s"
              break
            fi
            if [ "$i" = 15 ]; then
              echo "::error::/readyz never responded"
              docker logs smoke || true
              exit 1
            fi
            sleep 1
          done

          echo "--- unreachable AdGuard must mark the sidecar unhealthy ---"
          # Both health flags start true, so /healthz legitimately answers 200
          # until the first sync fails: poll rather than sampling once. Reaching
          # 503 while /readyz stays 200 is the readiness/liveness split working.
          for i in $(seq 1 15); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/healthz || true)
            if [ "$code" = "503" ]; then
              echo "OK: /healthz -> 503 after ${i}s"
              break
            fi
            if [ "$i" = 15 ]; then
              echo "::error::/healthz stayed $code; expected 503 while AdGuard is unreachable"
              docker logs smoke || true
              exit 1
            fi
            sleep 1
          done

          # /readyz must still be serving 200 - an AdGuard outage must not look
          # like a dead process, or Kubernetes would restart it.
          ready=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/readyz || true)
          if [ "$ready" != "200" ]; then
            echo "::error::/readyz -> $ready while unhealthy; expected 200"
            exit 1
          fi
          echo "OK: /readyz still 200 while unhealthy"

          echo "--- container logs ---"
          docker logs smoke

      - name: Clean up smoke test container
        if: ${{ always() && !inputs.push }}
        run: docker rm -f smoke 2>/dev/null || true
